<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submit Interception &amp; Action Resolution</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.75rem;
    }
    .subtitle {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
      max-width: 680px;
      line-height: 1.5;
    }
    svg { width: 100%; min-width: 900px; display: block; }
    .name { font-family: 'Geist', sans-serif; font-size: 12px; font-weight: 600; fill: #2d3142; }
    .sub  { font-family: 'Geist Mono', monospace; font-size: 8px; fill: #4f5d75; }
    .dec  { font-family: 'Geist', sans-serif; font-size: 12px; font-weight: 600; fill: #2d3142; }
    .lbl  { font-family: 'Geist Mono', monospace; font-size: 8px; fill: #4f5d75; letter-spacing: 0.06em; }
    .callout { font-family: 'Instrument Serif', serif; font-size: 14px; font-style: italic; fill: #2d3142; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · SecureGPT Extension</p>
    <h1>Submit Interception &amp; Action Resolution</h1>
    <p class="subtitle">After detection, the most restrictive per-entity action wins — BLOCK &gt; MASK &gt; WARN_ALLOW &gt; ALLOW. Rule-level overrides take precedence over category defaults.</p>

    <svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ── Arrows ─────────────────────────────────────── -->
      <line x1="500" y1="56"  x2="500" y2="100"  stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="500" y1="156" x2="500" y2="168"  stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="580" y1="200" x2="688" y2="200"  stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="500" y1="232" x2="500" y2="268"  stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="580" y1="300" x2="688" y2="300"  stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="500" y1="332" x2="500" y2="368"  stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="580" y1="400" x2="688" y2="400"  stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="500" y1="432" x2="500" y2="472"  stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="624" y="180" width="24" height="12" fill="#f5f5f5"/>
      <text x="636" y="188" class="lbl" text-anchor="middle">yes</text>
      <rect x="508" y="248" width="20" height="12" fill="#f5f5f5"/>
      <text x="516" y="256" class="lbl" text-anchor="middle">no</text>
      <rect x="624" y="280" width="24" height="12" fill="#f5f5f5"/>
      <text x="636" y="288" class="lbl" text-anchor="middle">yes</text>
      <rect x="508" y="348" width="20" height="12" fill="#f5f5f5"/>
      <text x="516" y="356" class="lbl" text-anchor="middle">no</text>
      <rect x="624" y="380" width="24" height="12" fill="#f5f5f5"/>
      <text x="636" y="388" class="lbl" text-anchor="middle">yes</text>
      <rect x="508" y="452" width="20" height="12" fill="#f5f5f5"/>
      <text x="516" y="460" class="lbl" text-anchor="middle">no</text>

      <!-- ── Nodes ───────────────────────────────────────── -->
      <rect x="412" y="8" width="176" height="48" rx="24" fill="#ffffff" stroke="#2d3142"/>
      <text x="500" y="28" class="name" text-anchor="middle">Submit intercepted</text>
      <text x="500" y="40" class="sub" text-anchor="middle">guards passed · detection ran</text>

      <rect x="380" y="100" width="240" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36"/>
      <text x="500" y="124" class="name" text-anchor="middle">Resolve action</text>
      <text x="500" y="140" class="sub" text-anchor="middle">BLOCK &gt; MASK &gt; WARN_ALLOW &gt; ALLOW</text>

      <polygon points="500,168 580,200 500,232 420,200" fill="#ffffff" stroke="#2d3142"/>
      <text x="500" y="204" class="dec" text-anchor="middle">BLOCK?</text>

      <polygon points="500,268 580,300 500,332 420,300" fill="#ffffff" stroke="#2d3142"/>
      <text x="500" y="304" class="dec" text-anchor="middle">MASK?</text>

      <polygon points="500,368 580,400 500,432 420,400" fill="#ffffff" stroke="#2d3142"/>
      <text x="500" y="404" class="dec" text-anchor="middle">WARN?</text>

      <rect x="688" y="172" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142"/>
      <text x="760" y="196" class="name" text-anchor="middle">BLOCK</text>
      <text x="760" y="212" class="sub" text-anchor="middle">banner + modal + log</text>

      <rect x="688" y="272" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142"/>
      <text x="760" y="296" class="name" text-anchor="middle">MASK</text>
      <text x="760" y="312" class="sub" text-anchor="middle">mask text · reattach · log</text>

      <rect x="688" y="372" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142"/>
      <text x="760" y="396" class="name" text-anchor="middle">WARN_ALLOW</text>
      <text x="760" y="412" class="sub" text-anchor="middle">shield modal · resubmit</text>

      <rect x="428" y="472" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142"/>
      <text x="500" y="496" class="name" text-anchor="middle">ALLOW</text>
      <text x="500" y="512" class="sub" text-anchor="middle">log + resubmit</text>

      <!-- ── Editorial callout ───────────────────────────── -->
      <text x="40" y="56" class="callout">Guards + DETECT_PII run first —</text>
      <text x="40" y="76" class="callout">any failure resubmits the prompt.</text>
      <path d="M 260 72 Q 340 44 404 36" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="404" cy="36" r="2" fill="#2d3142"/>
    </svg>
  </div>
</body>
</html>

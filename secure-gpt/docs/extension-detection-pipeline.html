<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extension Detection Pipeline</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.75rem;
    }
    .subtitle {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
      max-width: 680px;
      line-height: 1.5;
    }
    svg { width: 100%; min-width: 900px; display: block; }
    .name { font-family: 'Geist', sans-serif; font-size: 12px; font-weight: 600; fill: #2d3142; }
    .sub  { font-family: 'Geist Mono', monospace; font-size: 8px; fill: #4f5d75; }
    .dec  { font-family: 'Geist', sans-serif; font-size: 12px; font-weight: 600; fill: #2d3142; }
    .lbl  { font-family: 'Geist Mono', monospace; font-size: 8px; fill: #4f5d75; letter-spacing: 0.06em; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · SecureGPT Extension</p>
    <h1>Detection Pipeline</h1>
    <p class="subtitle">Local detectPII() flow — regex tier, then NER on regex-masked text, entities merged by tier priority, then allowlist-filtered.</p>

    <svg viewBox="0 0 1000 820" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ── Arrows ─────────────────────────────────────── -->
      <line x1="500" y1="56"  x2="500" y2="88"   stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="620" y1="140" x2="720" y2="140"  stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="500" y1="180" x2="500" y2="240"  stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="500" y1="296" x2="500" y2="340"  stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="500" y1="396" x2="500" y2="440"  stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="500" y1="496" x2="500" y2="540"  stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="500" y1="604" x2="500" y2="648"  stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="500" y1="704" x2="500" y2="748"  stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="656" y="120" width="24" height="12" fill="#f5f5f5"/>
      <text x="668" y="128" class="lbl" text-anchor="middle">yes</text>
      <rect x="508" y="204" width="20" height="12" fill="#f5f5f5"/>
      <text x="516" y="212" class="lbl" text-anchor="middle">no</text>

      <!-- ── Nodes ───────────────────────────────────────── -->
      <rect x="412" y="8" width="176" height="48" rx="24" fill="#ffffff" stroke="#2d3142"/>
      <text x="500" y="28" class="name" text-anchor="middle">detectPII</text>
      <text x="500" y="40" class="sub" text-anchor="middle">(text, config)</text>

      <polygon points="500,100 620,140 500,180 380,140" fill="#ffffff" stroke="#2d3142"/>
      <text x="500" y="144" class="dec" text-anchor="middle">text empty?</text>

      <rect x="720" y="120" width="160" height="48" rx="24" fill="#ffffff" stroke="#2d3142"/>
      <text x="800" y="144" class="name" text-anchor="middle">Empty result</text>
      <text x="800" y="156" class="sub" text-anchor="middle">hasFindings: false</text>

      <rect x="412" y="240" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142"/>
      <text x="500" y="264" class="name" text-anchor="middle">Regex tier</text>
      <text x="500" y="280" class="sub" text-anchor="middle">regexTier.run(text, config)</text>

      <rect x="412" y="340" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142"/>
      <text x="500" y="364" class="name" text-anchor="middle">Mask regex spans</text>
      <text x="500" y="380" class="sub" text-anchor="middle">spaces replace matched text</text>

      <rect x="412" y="440" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142"/>
      <text x="500" y="464" class="name" text-anchor="middle">NER tier</text>
      <text x="500" y="480" class="sub" text-anchor="middle">onnxruntime-web · WordPiece</text>

      <rect x="380" y="540" width="240" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36"/>
      <text x="500" y="564" class="name" text-anchor="middle">mergeEntities</text>
      <text x="500" y="584" class="sub" text-anchor="middle">tier priority wins · same-tier → confidence</text>

      <rect x="412" y="648" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142"/>
      <text x="500" y="672" class="name" text-anchor="middle">Allowlist filter</text>
      <text x="500" y="688" class="sub" text-anchor="middle">org patterns dropped</text>

      <rect x="404" y="748" width="192" height="48" rx="24" fill="#ffffff" stroke="#2d3142"/>
      <text x="500" y="772" class="name" text-anchor="middle">DetectionResult</text>
      <text x="500" y="784" class="sub" text-anchor="middle">entities · tier · hasFindings</text>
    </svg>
  </div>
</body>
</html>

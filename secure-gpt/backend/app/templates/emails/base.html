<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}{{ title | default('SecureGPT Notification') }}{% endblock %}</title>
  <!--[if !mso]><!-->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!--<![endif]-->
  <style type="text/css">
    body {
      margin: 0;
      padding: 0;
      min-width: 100%;
      background-color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    table { border-collapse: collapse; }
    img { border: 0; outline: none; text-decoration: none; }
    @media only screen and (max-width: 620px) {
      .card-wrap { width: 100% !important; max-width: 100% !important; border-radius: 0 !important; }
      .inner-pad { padding: 30px 20px !important; }
      .header-pad { padding: 20px !important; }
      .footer-pad { padding: 20px !important; }
      .otp-val { font-size: 31px !important; letter-spacing: 7px !important; }
      .brand-name { font-size: 18px !important; }
    }
  </style>
</head>
<body style="margin: 0; padding: 32px 12px; background-color: #f1f5f9; -webkit-font-smoothing: antialiased;">
  <table width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation" style="background-color: #f1f5f9;">
    <tr>
      <td align="center" style="padding: 0;">
        <table class="card-wrap" width="560" border="0" cellpadding="0" cellspacing="0" role="presentation" style="width: 560px; max-width: 560px; background-color: #ffffff; border-radius: 12px; overflow: hidden; border: 1px solid #e2e8f0; box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.07), 0 8px 10px -6px rgba(15, 23, 42, 0.03);">
          <!-- Header -->
          <tr>
            <td class="header-pad" style="background-color: #0f172a; padding: 23px 32px; border-bottom: 1px solid #1e293b;">
              <table width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation">
                <tr>
                  <td align="left" style="vertical-align: middle;">
                    <div class="brand-name" style="font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 19px; font-weight: 700; color: #ffffff; letter-spacing: -0.4px;">
                      Secure<span style="color: #3b82f6;">GPT</span>
                    </div>
                  </td>
                  <td align="right" style="vertical-align: middle;">
                    {% block header_badge %}
                    <span style="display: inline-block; background-color: #172554; border: 1px solid #1d4ed8; color: #93c5fd; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 10px; font-weight: 600; padding: 5px 9px; border-radius: 5px; letter-spacing: 0.55px; text-transform: uppercase;">
                      Notification
                    </span>
                    {% endblock %}
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Main Content -->
          <tr>
            <td class="inner-pad" style="padding: 36px 32px 30px 32px; text-align: left;">
              {% block content %}{% endblock %}
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td class="footer-pad" style="background-color: #f8fafc; border-top: 1px solid #e2e8f0; padding: 21px 32px; text-align: center;">
              <p style="margin: 0 0 5px 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11px; color: #64748b; line-height: 1.5;">
                Sent automatically by SecureGPT Enterprise Platform
              </p>
              <p style="margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 10px; color: #94a3b8; line-height: 1.5;">
                &copy; 2026 SecureGPT DLP Solutions Inc. All rights reserved.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
